# Local infrastructure for the Atlas Liquidity Platform.
#
# LAYER 2 TEACHING NOTE
# ---------------------
# Why Postgres when the job description says Oracle?
#
# Because Oracle's licensed images are painful to obtain and enormous to run,
# and 95% of what you need to demonstrate - schema migrations, transactions,
# isolation levels, indexing, optimistic locking, connection pooling, the N+1
# problem - is identical on both. ADR 0004 records this decision and lists the
# specific places where Oracle genuinely differs, so you can speak to them.
#
# LAYER 4 TEACHING NOTE
# ---------------------
# Kafka runs in KRaft mode - no ZooKeeper. Every Kafka tutorial older than about
# 2023 starts a ZooKeeper container alongside the broker; ZooKeeper held cluster
# metadata (which broker leads which partition, who is in the ISR). KRaft moves
# that metadata into Kafka itself, as an internal log, managed by controller
# nodes. One less distributed system to operate, faster failover, and far more
# partitions per cluster. If an interviewer mentions ZooKeeper, knowing it is on
# its way out - removed entirely in Kafka 4.0 - is a current-knowledge signal.
#
# This is ONE broker with a replication factor of ONE. That is a laptop, not a
# bank: a real cluster runs at least three brokers with replication factor 3 and
# min.insync.replicas=2, so a single machine failure loses nothing. Be explicit
# about that difference rather than pretending this is production-shaped.
#
# Start it:   docker compose up -d
# Stop it:    docker compose down
# Wipe it:    docker compose down -v      (deletes the volumes - full reset)

services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    environment:
      POSTGRES_DB: atlas_liquidity
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports:
      - "5432:5432"
    volumes:
      - atlas-pgdata:/var/lib/postgresql/data
      # Runs ONCE, when the data directory is empty. Creates the test database
      # and the two position-service databases. On an existing volume Postgres
      # ignores this entirely - which is why Layer 4 part 2 also gives you the
      # createdb commands to run by hand the first time.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Kubernetes readiness probes in Layer 10 are the same idea: do not send
      # traffic to a container until it can actually answer.
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_liquidity"]
      interval: 5s
      timeout: 3s
      retries: 10

  # An INIT CONTAINER, and worth recognising by name: it does one small job,
  # exits, and the real container waits for it to succeed. Kubernetes has exactly
  # this concept - initContainers - and Layer 10 will use them for the same kind
  # of work.
  #
  # The job here is preparing the volume. A fresh Docker named volume is created
  # root-owned when its mount point does not already exist inside the image, and
  # the apache/kafka image runs as a non-root user - so the broker would start,
  # fail to write its log directory, and exit. This runs first and makes the
  # directory writable.
  #
  # chmod 777 is a laptop shortcut and should be recognised as one. The correct
  # answers are a Dockerfile that creates the directory owned by the runtime user,
  # or in Kubernetes a securityContext with fsGroup, which makes the kubelet set
  # group ownership on the mounted volume for you.
  kafka-init:
    image: busybox:1.36
    container_name: atlas-kafka-init
    command: ["sh", "-c", "mkdir -p /var/lib/kafka/data && chmod -R 777 /var/lib/kafka/data"]
    volumes:
      - atlas-kafka-data:/var/lib/kafka/data

  kafka:
    image: apache/kafka:3.9.0
    container_name: atlas-kafka
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      # 9092 is the listener your application and the CLI on your laptop use.
      - "9092:9092"
    environment:
      # --- KRaft: this single container is both broker and controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

      # --- Listeners ---
      # THREE listeners, and the reason is the single most common Kafka-in-Docker
      # trip-up. A Kafka client does not keep talking to the address you gave it:
      # it asks the broker for metadata, and the broker replies with the
      # ADVERTISED address of whichever broker leads each partition. The client
      # then connects to THAT.
      #
      # So a broker advertising "kafka:19092" is unreachable from your laptop
      # (no such hostname), and a broker advertising "localhost:9092" is
      # unreachable from another container (localhost means itself). Hence one
      # listener advertised as "kafka:19092" for container-to-container traffic
      # and one advertised as "localhost:9092" for you.
      #
      # "It connects and then times out" is almost always this.
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Single-node settings ---
      # All of these are 1 only because there is one broker. In production every
      # one of them would be 3, and min.insync.replicas would be 2 so that a
      # producer using acks=all survives losing a broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Auto-created topics get 3 partitions, so partitioning by account key is
      # observable rather than theoretical. Note that auto-creation itself is
      # switched OFF in most banks - a typo in a topic name silently creating a
      # new topic is not a feature. Part 2 declares topics explicitly.
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

      # NOT /tmp. The image's default log directory is under /tmp with no volume
      # behind it, so the entire broker log - every topic, every message, every
      # consumer offset - lives in the container's writable layer and is destroyed
      # the moment the container is recreated.
      #
      # That is how a topic full of events vanished on 26 Aug while the outbox
      # still showed them as published: the producer had genuinely sent them, and
      # the broker that received them no longer existed. Postgres had a volume
      # from Layer 2; Kafka did not. Durable-by-default is a property you have to
      # arrange, not one you get.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - atlas-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # LAYER 4 PART 3. The schema registry: an HTTP service that stores Avro schemas,
  # hands out an integer id for each, and - the part that matters - REFUSES to
  # register a new version that is incompatible with the ones already there.
  #
  # Note where it keeps them: in a Kafka topic called _schemas. It is not a
  # database with its own backup story; it is a compacted log in the cluster it
  # serves, which is a neat piece of design and also means losing the cluster
  # loses the registry.
  #
  # Port 8085, not Confluent's default 8081, because 8081 is reference-data-service.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: atlas-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:19092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8085

      # BACKWARD is the default and the right one for most systems, and it is
      # worth being able to say precisely what it means: a NEW schema must be able
      # to read data written by the OLD one. So consumers can be upgraded first,
      # then producers - which is the safe deployment order, because a consumer
      # that understands both shapes can never be surprised.
      #
      # FORWARD is the mirror: old schema reads new data, so producers upgrade
      # first. FULL is both. NONE turns the whole thing off and is how teams end
      # up with a registry that stores schemas and enforces nothing.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Optional, but worth having: a browser view of topics, partitions, offsets and
  # message payloads. Seeing a message sitting on partition 2 with your account
  # id as its key makes partitioning concrete in a way a diagram does not.
  # Comment this service out if you would rather save the memory.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: atlas-kafka-ui
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: atlas-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      # Point the UI at the registry too, so it can decode Avro messages for you
      # and show the registered schemas and their versions.
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8085
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  atlas-pgdata:
  atlas-kafka-data:
