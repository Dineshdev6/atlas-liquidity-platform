# Integration-test configuration. Active only under the "it" profile, which
# AbstractPostgresIntegrationTest switches on.
#
# HOW SPRING RESOLVES THIS
# Spring loads application.yml first (from the main module, on the test
# classpath), then layers application-<profile>.yml over it. Only the keys below
# are overridden; everything else - Hikari sizing, ddl-auto: validate,
# open-in-view: false, the logging pattern - is inherited from the main config.
# That matters: the tests exercise the SAME settings the application runs with,
# apart from which database they point at.
#
# ONE YAML RULE WORTH LEARNING THE EASY WAY
# Every top-level key appears EXACTLY ONCE in a YAML document. Writing "spring:"
# twice does not merge the two blocks - Spring Boot refuses to load the file at
# all, and because this file only loads under the "it" profile the damage shows
# up as every single integration test failing to build its ApplicationContext
# while the unit tests carry on passing. If a whole IT suite dies at once and
# the unit tests are fine, suspect the profile's config file before the code.

spring:
  datasource:
    # Same Postgres instance as the application, different database.
    url: jdbc:postgresql://localhost:5432/atlas_liquidity_test
    username: atlas
    password: atlas
    hikari:
      # A test JVM needs far fewer connections than a running service, and a
      # small pool makes connection-leak bugs surface fast rather than hiding
      # until production.
      maximum-pool-size: 5
      pool-name: atlas-it-pool

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Deliberately NOT clean-on-start. Flyway's clean is disabled by default
    # since Flyway 9 precisely because someone, somewhere, pointed it at
    # production. We rely on the tests restoring what they change instead.

  jpa:
    # Left at validate, same as production. If a migration and an entity drift
    # apart, the integration tests fail to start - which is exactly when you
    # want to find out.
    hibernate:
      ddl-auto: validate

  # LAYER 4. Present so the producer bean can be built. Nothing in the
  # integration tests actually sends: OutboxIT asserts on rows in the outbox
  # table, and the publish path is covered by OutboxPublisherTest with a mocked
  # KafkaTemplate. A Kafka producer connects lazily, on first send, so the whole
  # suite still runs with no broker on the machine.
  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    # Uncomment to watch the SQL the tests generate. Doing this once, and
    # counting the queries, is how the N+1 problem stops being an abstraction.
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: INFO
    com.zaxxer.hikari: INFO
    org.apache.kafka: WARN

# ---------------------------------------------------------------------------
# LAYER 4: the outbox relay is DISABLED for integration tests
# ---------------------------------------------------------------------------
# A testing decision worth understanding rather than a convenience.
#
# With the timer running, it would race every test: assert that an outbox row is
# unpublished and you are asserting against a stopwatch; assert that one exists
# and the relay may already have stamped it. Tests that depend on wall-clock
# timing are the flakiest tests there are, and a flaky test is worse than no
# test because it trains people to re-run the build instead of reading it.
#
# So the timer is off and OutboxIT calls publisher.publishPending() directly.
# The scheduling is trivial and framework-owned; the publishing logic is ours,
# and that is what deserves the test.
atlas:
  # No integration test publishes, so nothing here contacts the registry. Present
  # so the producer bean can be built, and pointing at the same place production
  # does so a typo in the real value would not be masked here.
  schema-registry:
    url: http://localhost:8085

  outbox:
    relay-enabled: false
