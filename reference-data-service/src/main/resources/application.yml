spring:
  application:
    name: reference-data-service
  lifecycle:
    timeout-per-shutdown-phase: 25s

  # ---------------------------------------------------------------------------
  # LAYER 2: datasource
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/atlas_liquidity
    username: atlas
    password: atlas
    hikari:
      # HikariCP is Spring Boot's default pool. These numbers are deliberately
      # small, and the reasoning matters more than the values.
      #
      # A connection pool is a QUEUE, not a cache. Every pooled connection is a
      # backend process on the database server holding memory. Postgres starts
      # to degrade well before a thousand connections, so 20 services each
      # opening 50 connections will take the database down long before it takes
      # the services down.
      #
      # The counter-intuitive rule: a SMALLER pool is usually FASTER. If the
      # database can genuinely do 10 things at once, a pool of 100 does not make
      # it do 100 - it makes 100 queries contend, and every one of them gets
      # slower. Layer 7 measures this properly with JMeter.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000      # fail fast rather than pile up waiters
      idle-timeout: 600000
      max-lifetime: 1800000         # recycle before any network/DB idle killer does
      pool-name: atlas-refdata-pool

  jpa:
    hibernate:
      # NEVER "update" or "create-drop" outside a throwaway demo. Letting
      # Hibernate mutate a production schema is how you lose a column.
      # "validate" makes Hibernate check its mapping against the real schema at
      # startup and refuse to boot on a mismatch - so a forgotten migration
      # fails loudly on deploy instead of quietly at 3am. Flyway owns the
      # schema; Hibernate only reads it. See ADR 0003.
      ddl-auto: validate
    # open-in-view leaves the Hibernate session open for the whole HTTP request,
    # so lazy collections can be loaded from inside the view layer. It is on by
    # default and it is a trap: it hides N+1 queries, holds a pooled connection
    # for the entire request including time spent serialising JSON, and makes
    # transaction boundaries meaningless. Turn it off, deliberately, every time.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Fail rather than guess if the schema history looks wrong.
    baseline-on-migrate: false
    validate-on-migrate: true

  # ---------------------------------------------------------------------------
  # LAYER 4: Kafka
  # ---------------------------------------------------------------------------
  # Only the address lives here. Everything else about the producer - acks,
  # idempotence, retries, batching - is declared in KafkaProducerConfig, in Java,
  # where each setting can carry the reason it was chosen. Configuration that
  # matters deserves a comment more than it deserves a YAML line.
  #
  # Note the service starts perfectly well with no broker running: a Kafka
  # producer connects lazily, on first send. The relay will log warnings once a
  # second and the outbox will grow, which is exactly the designed behaviour -
  # nothing is lost, it is simply not published yet. Try it: stop the Kafka
  # container while the service is running and watch the backlog build, then
  # start it again and watch it drain.
  kafka:
    bootstrap-servers: localhost:9092

# ---------------------------------------------------------------------------
# LAYER 4: outbox relay
# ---------------------------------------------------------------------------
atlas:
  # LAYER 4 PART 3. Where the event schemas live.
  #
  # 8085 rather than 8081, because 8081 is this service - and 8081 is also the
  # Confluent default for the registry, which makes for a genuinely confusing
  # afternoon if you let them collide.
  schema-registry:
    url: http://localhost:8085

  outbox:
    # Topic naming: <organisation>.<domain>.<event>.<major version>. The version
    # is in the NAME because a breaking schema change then becomes a new topic
    # that old consumers simply never see, rather than a poisoned message they
    # cannot parse. Part 3 adds a schema registry, which handles the compatible
    # changes; the topic version is for the incompatible ones.
    # v2, and the bump is the versioning strategy doing its job. v1 carries JSON;
    # v2 carries Avro. That is an INCOMPATIBLE change - an Avro consumer reading a
    # JSON message finds no magic byte and fails - and an incompatible change is
    # exactly what a version in the topic name is for. Compatible changes are the
    # schema registry's job, and it will not let you make an incompatible one
    # within a single topic.
    #
    # The practical benefit: v1 still exists, untouched, with its history intact.
    # Nothing had to be migrated and no consumer was broken; they move over when
    # they are ready, and v1 is retired when nobody reads it.
    topic: atlas.liquidity.buffer-changed.v2

    # One second. Latency you would not accept for a user-facing read, and
    # completely unremarkable for asynchronous propagation - the position engine
    # does not care whether it learns about a buffer change now or in 800ms, it
    # cares that it learns exactly once and in order. If it ever did care, the
    # answer is change data capture, not a tighter poll.
    poll-interval-ms: 1000

    # Give the application time to finish starting before the first run. A
    # scheduled job firing while the context is still coming up is a classic
    # source of confusing startup failures.
    initial-delay-ms: 5000

    # Switched off in the integration-test profile so tests can inspect outbox
    # rows deterministically instead of racing a timer.
    relay-enabled: true

server:
  port: 8081
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  # The health endpoint now reports the database too. In Layer 10 that becomes
  # meaningful: readiness fails when Postgres is unreachable, so Kubernetes
  # stops routing traffic to a pod that cannot serve it, rather than letting it
  # return 500s to users.
  health:
    db:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Reference Data Service
    layer: "4 - event-driven backbone (part 1: transactional outbox)"

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-no-correlation-id}] %logger{36} - %msg%n"
  level:
    com.atlas.liquidity: DEBUG
    # Kafka's own client logging is extremely chatty at INFO - it prints the
    # full producer configuration on startup and a line per metadata refresh.
    # Raised to WARN so your own logs stay readable. Drop it back to INFO when
    # you actually need to see what the client is negotiating.
    org.apache.kafka: WARN
    # Uncomment these two to see every SQL statement Hibernate issues, with
    # bound parameters. This is how you SEE the N+1 problem rather than reading
    # about it - do it once, deliberately, in Layer 2's exercises.
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
