# Integration-test configuration for position-service. Active only under the "it"
# profile, which AbstractPostgresIntegrationTest switches on.
#
# Every top-level key appears EXACTLY ONCE in a YAML document. Writing "spring:"
# twice does not merge the blocks - Spring Boot refuses to load the file at all,
# and because this file only loads under one profile the damage shows up as every
# integration test failing to build its context while the unit tests carry on
# passing. That asymmetry is the diagnostic.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/atlas_positions_test
    username: atlas
    password: atlas
    hikari:
      maximum-pool-size: 5
      pool-name: atlas-position-it-pool

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

  kafka:
    # Present so the consumer and DLT producer beans can be built. No integration
    # test here starts a listener container or sends anything - the consumer's
    # logic is tested directly through PositionUpdateService, and the listener
    # itself is a unit test with a mocked service. So the suite runs with no
    # broker on the machine, and a Kafka outage cannot make the build red for
    # reasons unrelated to the change being tested.
    bootstrap-servers: localhost:9092

    # Listener containers are NOT started in tests. Without this, every
    # @SpringBootTest would spin up three consumer threads that connect to the
    # broker, join the real group, and start eating the real topic - making the
    # tests slow, non-deterministic, and destructive to whatever you were about to
    # demonstrate by hand.
    #
    # KafkaConsumerConfig reads this property explicitly. Spring Boot's own
    # handling of it only reaches the auto-configured factory, and we declare our
    # own - the recurring cost of taking control of a bean is inheriting the
    # settings you used to get for free.
    listener:
      auto-startup: false

logging:
  level:
    org.flywaydb: INFO
    com.zaxxer.hikari: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN

atlas:
  # Present so the consumer and DLT producer beans can be built. No integration
  # test starts a listener or sends anything, so nothing here actually contacts
  # the registry - the suite still runs with no broker and no registry on the
  # machine.
  schema-registry:
    url: http://localhost:8085

  events:
    buffer-changed-topic: atlas.liquidity.buffer-changed.v2
    consumer-group: atlas-position-service-it
